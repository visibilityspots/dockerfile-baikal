name: CI

on:
  push:
    tags:
      - '*'
jobs:
  main:
    uses: visibilityspots/github-workflows/.github/workflows/main.yml@main
    with:
      # the ckulka/baikal base image has no linux/arm/v6 variant
      platforms: linux/amd64,linux/arm/v7,linux/arm64
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
