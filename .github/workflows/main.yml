name: CI

on:
  push:
    tags:
      - '*'
  # test only: the shared workflow skips deploy on pull requests
  pull_request:
    branches: [main]
# release, CHANGELOG commit: this repo's default token is read-only
permissions:
  contents: write

jobs:
  main:
    uses: visibilityspots/github-workflows/.github/workflows/main.yml@main
    with:
      # the ckulka/baikal base image has no linux/arm/v6 variant
      platforms: linux/amd64,linux/arm/v7,linux/arm64
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
